name: ci
on:
  push:
  pull_request:

# No job reaches Cloudflare, Discord or a mail server: the tests use fakes.
jobs:
  support:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Migrations run as the owner; the database tests run as support_app, so a missing GRANT fails here.
      SUPPORT_TEST_OWNER_URL: postgresql://support:ci-owner@localhost:5432/support
      SUPPORT_TEST_DATABASE_URL: postgresql://support_app:ci-app@localhost:5432/support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q
      - name: Image builds
        run: docker build -t rackloom-support:ci .
